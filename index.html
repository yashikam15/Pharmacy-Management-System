<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<title>Add Medicine</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #e8f5e9, #f9f9f9);
}

.container {
    width: 400px;
    margin: 80px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #2e7d32;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

a {
    display: block;
    text-align: center;
    margin-top: 15px;
    text-decoration: none;
    color: #2e7d32;
}
</style>
</head>

<body>

<div class="container">
<h2>Add Medicine</h2>

<form action="/post" method="post">
<input name="medicineName" placeholder="Medicine Name" required>
<input name="companyName" placeholder="Company Name" required>
<input name="price" type="number" placeholder="Price" required>
<input name="quantity" type="number" placeholder="Quantity" required>
<input name="expirationDate" type="date" required>

<button>Add Medicine</button>
</form>

<a href="home.html">⬅ Back to Home</a>
</div>

</body>
</html>
